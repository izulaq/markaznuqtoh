<!DOCTYPE html>
<!-- coba materi.html - Integrasi Dinamis Supabase & Halaman Belajar -->
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materi - Nuqthah Learning Center</title>

    <meta name="theme-color" content="#0F4A3A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/logofix.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Poppins:wght@400;600;700&amp;display=swap"
        rel="stylesheet">

    <!-- CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2E5E4E',
                        accent: '#C9A227',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Poppins', sans-serif;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .course-card {
            box-shadow: 0 8px 25px -5px rgba(0, 0, 0, 0.08), 0 4px 10px -5px rgba(0, 0, 0, 0.04) !important;
        }

        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 35px -5px rgba(0, 0, 0, 0.15) !important;
        }

        .card-title-min-h {
            min-height: 2.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        #materimu-drawer {
            z-index: 90000 !important;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #drawer-overlay {
            z-index: 89999 !important;
        }

        nav.main-nav {
            z-index: 70000 !important;
        }

        .sticky-cat {
            top: 48px;
        }

        @media (min-width: 768px) {
            .sticky-cat {
                top: 64px;
            }
        }

        @keyframes nlc-spin {
            to {
                transform: rotate(360deg);
            }
        }

        #page-loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(6px);
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            transition: opacity 0.35s ease;
            opacity: 1;
        }

        #page-loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .page-loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(46, 94, 78, 0.15);
            border-top-color: #2E5E4E;
            border-radius: 50%;
            animation: nlc-spin 0.8s linear infinite;
        }
    </style>
</head>

<body class="bg-white text-gray-900 overflow-x-hidden">

    <!-- PAGE LOADING OVERLAY -->
    <div id="page-loading-overlay">
        <div class="page-loading-spinner"></div>
        <div class="text-[#2E5E4E] text-xs font-bold tracking-widest uppercase">Memuat Materi...</div>
    </div>

    <!-- Navigation -->
    <nav
        class="main-nav fixed top-0 left-0 right-0 w-full bg-primary text-white shadow-lg px-4 md:px-6 h-12 md:h-16 flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-2 md:gap-3 hover:opacity-90 transition-opacity">
            <i class="fas fa-home text-xl md:text-2xl text-white"></i>
            <span class="font-bold text-sm md:text-base hidden sm:inline">Kembali Ke Beranda</span>
            <span class="font-bold text-sm sm:hidden">Beranda</span>
        </a>
        <div class="flex items-center gap-2 md:gap-3">
            <a href="latihansoal.html"
                class="bg-accent text-white px-4 py-1.5 rounded-lg font-bold text-xs md:text-sm hover:bg-opacity-90 transition-all shadow-sm">
                <i class="fas fa-lightbulb"></i> Free Trial Quiz
            </a>
            <button onclick="toggleDrawer()"
                class="flex items-center gap-2 bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-lg transition-colors relative cursor-pointer">
                <i class="far fa-bookmark"></i>
                <span class="text-xs md:text-sm font-medium">Materimu</span>
                <span id="materimu-badge"
                    class="absolute -top-1 -right-1 bg-accent text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full border border-primary leading-none">0</span>
            </button>
        </div>
    </nav>

    <!-- Drawer Overlay & Materimu Drawer -->
    <div id="drawer-overlay" onclick="toggleDrawer()"
        class="fixed inset-0 bg-black/60 transition-opacity duration-300 opacity-0 pointer-events-none"></div>
    <div id="materimu-drawer"
        class="fixed inset-y-0 right-0 w-full max-w-[320px] md:max-w-[400px] bg-white shadow-2xl transition-transform duration-300 flex flex-col translate-x-full">
        <div class="p-5 border-b border-gray-100 flex items-center justify-between bg-primary text-white">
            <div class="flex items-center gap-3">
                <h2 class="text-lg font-bold">Materimu</h2>
                <span id="drawer-count-badge"
                    class="bg-accent px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase">0</span>
            </div>
            <button onclick="toggleDrawer()"
                class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/10"><i
                    class="fas fa-times"></i></button>
        </div>
        <div id="drawer-content" class="flex-grow overflow-y-auto p-4 space-y-4">
            <div id="drawer-empty" class="h-full flex flex-col items-center justify-center text-center p-8 opacity-40">
                <i class="far fa-bookmark text-5xl mb-4 text-primary"></i>
                <p class="text-sm font-medium">Belum ada materi yang disimpan.</p>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="mt-12 md:mt-16 pt-8 pb-4 px-6 text-center relative bg-white overflow-hidden">
        <div class="fade-in relative z-10 max-w-screen-md mx-auto">
            <h1 class="text-2xl md:text-4xl font-bold text-primary tracking-tight mb-2">Berfikir • Berdzikir • Berhasil
            </h1>
            <p class="text-accent text-base md:text-lg tracking-[0.2em] font-bold uppercase opacity-90">
                #mumtazbarengnuqthah</p>
        </div>
    </header>

    <!-- Filter Navigation -->
    <nav class="sticky sticky-cat z-[50] bg-white/95 backdrop-blur-md border-b border-gray-100 overflow-x-hidden">
        <div class="max-w-screen-xl mx-auto px-6">
            <div class="flex items-center justify-start md:justify-center overflow-x-auto hide-scrollbar gap-4 py-4"
                id="category-tabs">
                <button onclick="changeCategory('syariah')"
                    class="nav-tab px-6 py-2 rounded-full whitespace-nowrap transition-all font-medium bg-primary text-white"
                    data-category="syariah">Bimbel Syariah</button>
                <button onclick="changeCategory('ushul')"
                    class="nav-tab px-6 py-2 rounded-full whitespace-nowrap transition-all font-medium text-gray-600"
                    data-category="ushul">Bimbel Ushuludin</button>
                <button onclick="changeCategory('tafaqquh')"
                    class="nav-tab px-6 py-2 rounded-full whitespace-nowrap transition-all font-medium text-gray-600"
                    data-category="tafaqquh">Tafaqquh</button>
                <button onclick="changeCategory('tashil')"
                    class="nav-tab px-6 py-2 rounded-full whitespace-nowrap transition-all font-medium text-gray-600"
                    data-category="tashil">Ilmu Alat</button>
                <button onclick="changeCategory('amiyah')"
                    class="nav-tab px-6 py-2 rounded-full whitespace-nowrap transition-all font-medium text-gray-600"
                    data-category="amiyah">Amiyah Mesir</button>
            </div>
        </div>
    </nav>

    <!-- Sub-Filter Bar & Online/Offline Bar -->
    <div class="bg-gray-50/50 border-b border-gray-100 py-3 z-[49]">
        <div class="max-w-screen-xl mx-auto px-6 overflow-x-auto hide-scrollbar flex items-center justify-start md:justify-center gap-3"
            id="sub-filter-container"></div>
    </div>
    <div class="bg-primary/5 border-b border-gray-100 py-3 z-[48]">
        <div class="max-w-screen-xl mx-auto px-6 overflow-x-auto hide-scrollbar flex items-center justify-start md:justify-center gap-3"
            id="online-offline-filter"></div>
    </div>

    <!-- Main Content -->
    <main class="max-w-screen-xl mx-auto px-4 md:px-6 py-8 min-h-[60vh] overflow-hidden">
        <div id="course-grid"
            class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6 mb-24 overflow-hidden relative">
            <div id="empty-materi-state"
                class="col-span-full flex flex-col items-center justify-center py-16 px-4 text-center hidden">
                <div class="text-primary/20 text-5xl mb-4"><i class="fas fa-book-open"></i></div>
                <h3 class="text-[#2E5E4E] font-bold text-lg mb-2">Materi Belum Tersedia</h3>
                <p class="text-gray-500 text-sm max-w-sm mx-auto">Materi untuk program ini sedang dalam tahap penyusunan
                    kurikulum.</p>
            </div>
        </div>
    </main>

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://idwrkzekykarxnuoaysu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_N96gYsm_jeSntalN3qMVCA_TpXloD4u';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allCourses = [];
        let savedItems = [];

        function toggleDrawer() {
            const drawer = document.getElementById('materimu-drawer');
            const overlay = document.getElementById('drawer-overlay');
            if (!drawer || !overlay) return;
            const isOpen = !drawer.classList.contains('translate-x-full');
            drawer.classList.toggle('translate-x-full', isOpen);
            overlay.classList.toggle('opacity-0', isOpen);
            overlay.classList.toggle('pointer-events-none', isOpen);
        }

        async function fetchDynamicCourses() {
            try {
                const { data, error } = await supabaseClient.from('courses').select('*').order('position', { ascending: true });
                if (error) throw error;
                allCourses = data || [];
                renderCoursesToDOM();
            } catch (err) {
                console.error('Gagal memuat materi:', err);
            }
        }

        function renderCoursesToDOM() {
            const grid = document.getElementById('course-grid');
            grid.querySelectorAll('.course-card').forEach(el => el.remove());

            allCourses.forEach(course => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'course-card card-hover bg-white rounded-2xl overflow-hidden border border-gray-100 flex flex-col h-full fade-in';
                cardDiv.setAttribute('data-id', course.course_id);
                cardDiv.setAttribute('data-category', course.category);
                cardDiv.setAttribute('data-subfilter', course.subfilter);
                cardDiv.setAttribute('data-mode', course.mode || 'Online');
                cardDiv.style.display = 'none';

                cardDiv.innerHTML = `
                    <div class="relative overflow-hidden group aspect-[4/3]">
                        <img src="${course.image || 'https://userkv.r2.mayar.id/landing-page/assets/nuqthah-kind-kingdom-2402/d50a2464_fdggdd.png'}" alt="${course.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                        <div class="absolute top-2 left-2 z-20 bg-white/90 backdrop-blur-sm text-primary px-2 py-0.5 rounded-full text-[10px] font-bold shadow-sm uppercase">${course.mode || 'Online'}</div>
                    </div>
                    <div class="p-4 flex flex-col flex-grow">
                        <h3 class="text-sm font-bold text-gray-800 leading-tight mb-2 card-title-min-h">${course.title}</h3>
                        <div class="flex flex-col gap-0.5 mb-3 text-[10px] text-gray-600">
                            <div><i class="fas fa-user-tie mr-1 text-accent"></i><strong>${course.instructor || 'Pengajar Nuqthah'}</strong></div>
                            <div><i class="fas fa-book-open mr-1 text-primary"></i><span>${course.facility || 'Latihan Soal'}</span></div>
                        </div>
                        <div class="mt-auto">
                            <div class="text-primary font-bold text-base mb-2">${course.price}</div>
                            <!-- TOMBOL DAFTAR DIUBAH MENGARAH KE HALAMAN BELAJAR & PREVIEW -->
                            <a href="halaman_belajar.html?course_id=${course.course_id}" class="w-full py-2 bg-primary hover:bg-opacity-90 text-white text-[11px] font-bold rounded-lg transition-all flex items-center justify-center gap-1 cursor-pointer">
                                Mulai Belajar & Preview <i class="fas fa-arrow-right text-[8px]"></i>
                            </a>
                        </div>
                    </div>
                `;
                grid.appendChild(cardDiv);
            });
            applyFilters();
        }

        const PROGRAMS = {
            syariah: { label: 'Bimbel Syariah', subs: ['Tingkat 1', 'Tingkat 2', 'Tingkat 3'] },
            ushul: { label: 'Bimbel Ushuludin', subs: ['Tingkat 1', 'Tingkat 2', 'Tingkat 3'] },
            tafaqquh: { label: 'Tafaqquh', subs: ['Fiqih', 'Ushul Fiqh', 'Tauhid'] },
            tashil: { label: "Ta'shil", subs: ['Nahwu', 'Sharaf', 'Balaghah', 'Mantiq'] },
            amiyah: { label: 'Amiyah Mesir', subs: ['Dasar', 'Menengah', 'Lanjut'] }
        };

        let currentCategory = 'syariah';
        let currentSubFilter = 'Semua';
        let currentMode = 'Semua';

        window.changeCategory = function (key) {
            currentCategory = key; currentSubFilter = 'Semua'; currentMode = 'Semua';
            document.querySelectorAll('.nav-tab').forEach(t => {
                const act = t.getAttribute('data-category') === key;
                t.className = `nav-tab px-6 py-2 rounded-full whitespace-nowrap transition-all font-medium ${act ? 'bg-primary text-white' : 'text-gray-600'}`;
            });
            renderSubFilters(); renderOnlineOfflineFilter(); applyFilters();
        };

        function renderSubFilters() {
            const container = document.getElementById('sub-filter-container');
            container.innerHTML = '';
            const subs = ['Semuahal', ...(PROGRAMS[currentCategory]?.subs || [])];
            subs.forEach(sub => {
                const btn = document.createElement('button');
                const act = currentSubFilter === sub;
                btn.className = `px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all cursor-pointer ${act ? 'bg-accent text-white shadow-sm' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`;
                btn.textContent = sub;
                btn.onclick = () => { currentSubFilter = sub; renderSubFilters(); applyFilters(); };
                container.appendChild(btn);
            });
        }

        function renderOnlineOfflineFilter() {
            const container = document.getElementById('online-offline-filter');
            container.innerHTML = '';
            ['Semua', 'Online', 'Offline'].forEach(m => {
                const btn = document.createElement('button');
                const act = currentMode === m;
                btn.className = `px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all cursor-pointer ${act ? 'bg-primary text-white shadow-sm' : 'bg-white text-gray-600 border border-gray-200'}`;
                btn.textContent = m;
                btn.onclick = () => { currentMode = m; renderOnlineOfflineFilter(); applyFilters(); };
                container.appendChild(btn);
            });
        }

        function applyFilters() {
            let count = 0;
            document.querySelectorAll('.course-card').forEach(card => {
                const matchCat = card.getAttribute('data-category') === currentCategory;
                const matchSub = currentSubFilter === 'Semua' || card.getAttribute('data-subfilter') === currentSubFilter;
                const matchMode = currentMode === 'Semua' || card.getAttribute('data-mode').toLowerCase() === currentMode.toLowerCase();
                if (matchCat && matchSub && matchMode) { card.style.display = 'flex'; count++; } else { card.style.display = 'none'; }
            });
            document.getElementById('empty-materi-state').classList.toggle('hidden', count > 0);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await fetchDynamicCourses();
            renderSubFilters(); renderOnlineOfflineFilter();
            document.getElementById('page-loading-overlay').classList.add('hidden');
        });
    </script>
</body>

</html>
